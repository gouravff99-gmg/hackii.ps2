services:
  postgres:
    image: postgres:16-alpine
    container_name: ps02-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ps02
      POSTGRES_PASSWORD: ps02
      POSTGRES_DB: ps02
    ports:
      - "5432:5432"
    volumes:
      - ps02-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps02 -d ps02"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ps02-pgdata:
